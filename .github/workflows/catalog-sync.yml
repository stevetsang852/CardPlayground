name: catalog-sync

# Scheduled jobs only fire from the default branch (main) after merge.
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    name: daily-pokemon-card-download
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      M6A_SET_URL: https://www.kado.hk/database/tw/M6a
      KADO_REQUEST_DELAY_MS: "400"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install workspace deps
        run: npm ci --no-audit --no-fund
      - name: Download M6a Pokemon card data and card-scan URLs
        working-directory: backend
        run: npx ts-node-dev --transpile-only --exit-child -r tsconfig-paths/register src/catalog/downloadM6aCards.ts
      - name: Upload catalog artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-snapshot
          path: backend/data/m6a-cards.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Commit downloaded card data
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/data/m6a-cards.json
          if git diff --cached --quiet; then
            echo "No card data change"
            exit 0
          fi
          git commit -m "chore: refresh M6a Pokemon card data"
          git push
