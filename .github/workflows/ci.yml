name: ci

on:
  push:
  pull_request:

jobs:
  local-db:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install workspace deps
        working-directory: .
        run: npm install
      - name: Test local DB, auth, assets, catalog
        env:
          DATABASE_DRIVER: local
          DEBUG_AUTH_BYPASS: false
        run: npx jest src/config/localDatabase.test.ts src/config/database.test.ts src/config/authConfig.test.ts src/utils/playgroundToken.test.ts src/services/assetVerificationService.test.ts src/catalog/kadoParser.test.ts src/catalog/officialAsiaParser.test.ts src/catalog/kadoCatalogService.test.ts --coverage=false --runInBand
