name: ci

on:
  push:
  pull_request:

jobs:
  local-db:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install workspace deps
        working-directory: .
        run: npm install
      - name: Test local JSON database
        env:
          DATABASE_DRIVER: local
        run: npx jest src/config/localDatabase.test.ts src/config/database.test.ts --coverage=false --runInBand
