name: ci

on:
  push:
  pull_request:

jobs:
  local-db:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install workspace deps
        run: npm ci --no-audit --no-fund
      - name: Test pack odds (shared)
        working-directory: shared
        run: npx jest src/drawing/ptcgOdds.test.ts src/drawing/ptcgPackOdds.test.ts --coverage=false --runInBand
      - name: Test frontend draw and foil
        working-directory: client
        run: npx jest src/game src/i18n.test.ts src/animations/cardPaint.test.ts --coverage=false --runInBand
      - name: Test local DB, auth, assets, catalog, snapshot, redis, odds
        working-directory: backend
        env:
          DATABASE_DRIVER: local
          DEBUG_AUTH_BYPASS: false
          REDIS_URL: redis://127.0.0.1:6379
        run: npx jest src/config/localDatabase.test.ts src/config/database.test.ts src/config/authConfig.test.ts src/utils/playgroundToken.test.ts src/services/assetVerificationService.test.ts src/catalog/kadoParser.test.ts src/catalog/m6aCardsFile.test.ts src/catalog/officialAsiaParser.test.ts src/catalog/kadoCatalogService.test.ts src/catalog/kadoSnapshot.test.ts src/config/redis.catalog.test.ts src/catalog/ptcgOdds.backend.test.ts --coverage=false --runInBand

  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: database
            file: database/Dockerfile
            tags: cardplayground-database:latest
            target: ""
          - name: backend-debug
            file: backend/Dockerfile
            tags: cardplayground-backend:debug
            target: debug
          - name: backend-test
            file: backend/Dockerfile
            tags: cardplayground-backend:test
            target: test
          - name: frontend-debug
            file: client/Dockerfile
            tags: cardplayground-frontend:debug
            target: debug
          - name: frontend-test
            file: client/Dockerfile
            tags: cardplayground-frontend:test
            target: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          tags: ${{ matrix.tags }}
          load: true
          push: false
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
